name: macos-pkg

# Builds a universal (arm64 + amd64) macOS installer package on a macOS
# runner (pkgbuild is macOS-only) and uploads it to a GitHub release.
# Trigger: manual dispatch, or push of a `pkg-*` tag (e.g. `pkg-1.0.0`).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the .pkg to
        required: true
        default: v1.0.0
      version:
        description: Version stamped into the binary and package
        required: true
        default: 1.0.0
  push:
    tags:
      - "pkg-*"

env:
  RELEASE_TAG: ${{ inputs.tag }}
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Tag pushes (pkg-1.2.3) carry the version in the tag name; dispatch
      # inputs override it when given.
      - name: Resolve version
        run: |
          V="${VERSION:-${GITHUB_REF_NAME#pkg-}}"
          if [ -z "$V" ] || [ "$V" = "$GITHUB_REF_NAME" ]; then
            echo "cannot derive version from ref $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG:-v$V}" >> "$GITHUB_ENV"
          echo "resolved: version=$V release-tag=${RELEASE_TAG:-v$V}"

      - name: Build universal binary
        run: |
          V="$VERSION"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=$V" -o dist/amd64 ./cmd/mimo-backup
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=$V" -o dist/arm64 ./cmd/mimo-backup
          lipo -create dist/amd64 dist/arm64 -output dist/mimo-backup
          lipo -info dist/mimo-backup

      - name: Run tests
        env:
          MIMO_BACKUP_SKIP_PROC_GATE: "1"
        run: go test ./...

      - name: Build installer package
        run: |
          V="$VERSION"
          ROOT=pkgroot
          mkdir -p "$ROOT/usr/local/bin" \
                   "$ROOT/usr/local/share/bash-completion/completions" \
                   "$ROOT/usr/local/share/doc/mimo-backup"
          cp dist/mimo-backup "$ROOT/usr/local/bin/"
          cp completion/bash/mimo-backup "$ROOT/usr/local/share/bash-completion/completions/"
          cp README.md SPEC.md CHANGELOG.md LICENSE "$ROOT/usr/local/share/doc/mimo-backup/"
          pkgbuild \
            --root "$ROOT" \
            --identifier com.github.chubuk.mimo-backup \
            --version "$V" \
            --install-location / \
            --ownership recommended \
            "dist/mimo-backup-$V-macos.pkg"
          pkgutil --check-signature "dist/mimo-backup-$V-macos.pkg" || true
          ls -lh dist/*.pkg

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$VERSION"
          gh release upload "$RELEASE_TAG" \
            "dist/mimo-backup-$V-macos.pkg" \
            dist/mimo-backup \
            --clobber
